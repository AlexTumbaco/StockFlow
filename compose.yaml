services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  database-setup:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      DB_NAME: ${DB_NAME:-StockFlowDb}
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        /opt/mssql-tools18/bin/sqlcmd \
          -S sqlserver,1433 \
          -U sa \
          -P "$$MSSQL_SA_PASSWORD" \
          -C \
          -Q "IF DB_ID(N'$$DB_NAME') IS NULL EXEC('CREATE DATABASE [StockFlowDb]')"

volumes:
  sqlserver-data:
